spring:
  application.name: trendify-api
  jackson.default-property-inclusion: non_null
server:
  port: 8080
  error.include-message: never
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
trendify:
  aws:
    region: ${AWS_REGION:us-west-2}
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
    table-name: ${DYNAMODB_TABLE:trendify}
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  ml-url: ${ML_SERVICE_URL:http://localhost:8001}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
logging.pattern.console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger{36}","correlationId":"%X{correlationId:-}","message":"%replace(%msg){''"'',''\\"''}"}%n'
